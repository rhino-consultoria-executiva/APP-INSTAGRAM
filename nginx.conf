# =====================================================
# Nginx — rhinotreinamentos.com
#
# INSTALAÇÃO NO VPS:
#   1. Copie este arquivo para o servidor:
#        scp nginx.conf user@SEU_VPS:/etc/nginx/sites-available/rhinotreinamentos.com
#
#   2. Ative o site:
#        ln -s /etc/nginx/sites-available/rhinotreinamentos.com \
#              /etc/nginx/sites-enabled/rhinotreinamentos.com
#
#   3. Instale o Certbot e gere o SSL:
#        apt install certbot python3-certbot-nginx -y
#        certbot --nginx -d rhinotreinamentos.com -d www.rhinotreinamentos.com
#
#   4. Teste e recarregue o nginx:
#        nginx -t && systemctl reload nginx
#
# O Certbot irá preencher automaticamente os caminhos de SSL abaixo.
# =====================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rhinotreinamentos.com www.rhinotreinamentos.com;
    return 301 https://$host$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rhinotreinamentos.com www.rhinotreinamentos.com;

    root /var/www/rhinotreinamentos.com;
    index index.html;

    # SSL — preenchido pelo Certbot automaticamente
    ssl_certificate     /etc/letsencrypt/live/rhinotreinamentos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhinotreinamentos.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache para assets estáticos (CSS, JS, imagens, fontes)
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rota principal — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos de segurança
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
