# =====================================================
# GanchoReel — Deploy automático no GitHub Pages
#
# Dispara em todo push para a branch main.
# O site fica disponível em:
# https://<seu-usuario>.github.io/<nome-do-repo>/
#
# ATIVAÇÃO (faça uma vez no repositório):
#   Settings → Pages → Source → GitHub Actions
# =====================================================

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:       # permite disparar manualmente na UI do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Valida arquivos essenciais
      - name: Validate required files
        run: |
          echo "Verificando arquivos..."
          test -f index.html    || (echo "❌ index.html não encontrado" && exit 1)
          test -f css/style.css || (echo "❌ css/style.css não encontrado" && exit 1)
          test -f js/app.js     || (echo "❌ js/app.js não encontrado" && exit 1)
          echo "✅ Todos os arquivos presentes"

      # 3. Configura o GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 4. Empacota o site estático
      #    Exclui a pasta backend/ (apenas para referência, não vai ao deploy)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # Exclui arquivos que não devem ir ao GitHub Pages
          # (o upload-pages-artifact usa .gitignore automaticamente)

      # 5. Publica no GitHub Pages
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      # 6. Log da URL publicada
      - name: Log deployed URL
        run: echo "✅ Publicado em ${{ steps.deploy.outputs.page_url }}"
